<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Larlesienne-Carillon: paint or generate terrain, erode it into mountains and rivers, and render it as a classic atlas map.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a6c49a'/%3E%3Cpath d='M4 25l8-13 5 7 4-5 7 11z' fill='%238c7458'/%3E%3Cpath d='M0 27h32v5H0z' fill='%23bfe6f5'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Larlesienne-Carillon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: map-case workbench. Tool rail | map stage | inspector, under one command bar. */
:root {
  --bg: #e4e7df;
  --panel: #f4f5f0;
  --panel-2: #eaece5;
  --stage: #c9cec2;
  --ink: #1d2320;
  --muted: #5a635e;
  --line: #cbd0c6;
  --accent: #68466f;
  --accent-soft: #e6dceb;
  --accent-ink: #ffffff;
  --teal: #2c7b93;
  --warn: #9a4524;
  --ok: #3d6b45;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-map: "EB Garamond", Garamond, "Times New Roman", serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --panel: #1b201e; --panel-2: #222826; --stage: #0e1110; --ink: #e2e6df; --muted: #96a09a;
    --line: #2e3633; --accent: #c3a5cc; --accent-soft: #33283a; --accent-ink: #1a1220; --teal: #6bb4ca; --warn: #e2906b; --ok: #8cc296;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --panel: #1b201e; --panel-2: #222826; --stage: #0e1110; --ink: #e2e6df; --muted: #96a09a;
  --line: #2e3633; --accent: #c3a5cc; --accent-soft: #33283a; --accent-ink: #1a1220; --teal: #6bb4ca; --warn: #e2906b; --ok: #8cc296;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--f-ui); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 74px minmax(0, 1fr) 304px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "bar bar bar" "tools stage panel";
  gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- command bar */
.bar { grid-area: bar; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: 4px; }
.brand-mark { font: italic 500 21px/1 var(--f-map); letter-spacing: 0.01em; white-space: nowrap; }
.brand-sub { font: 500 10px/1 var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.name-in { width: 200px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font: 500 15px var(--f-map); letter-spacing: 0.06em; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 6px 11px; font-size: 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
#genKind { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; }
#genKind button { border-left: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 7px 4px; }
#genKind button:nth-child(3n) { border-right: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 11px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.icon { padding: 6px 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--warn); }
.btn.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.check.dim { opacity: 0.5; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.levels button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 3px 4px; display: grid; justify-items: center; gap: 3px; font-size: 10.5px; line-height: 1.15; color: var(--muted); text-align: center; }
.levels button i { width: 100%; height: 16px; border-radius: 3px; border: 1px solid rgb(0 0 0 / 0.12); }
.levels button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.anchor { display: grid; grid-template-columns: repeat(3, 22px); gap: 3px; flex: none; }
.anchor button { width: 22px; height: 22px; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 0; }
.anchor button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.btn svg { width: 15px; height: 15px; flex: none; }
.gen { position: relative; overflow: hidden; min-width: 168px; justify-content: center; }
.gen .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: color-mix(in srgb, var(--accent) 22%, transparent); transition: width 0.25s; }
.gen span { position: relative; }
.gen.stale { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.gen.fresh { color: var(--muted); }
.popwrap { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgb(0 0 0 / 0.18); padding: 6px; display: grid; gap: 2px; }
.pop button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; display: grid; gap: 1px; }
.pop button:hover:not(:disabled) { background: var(--panel-2); }
.pop button:disabled { opacity: 0.45; cursor: default; }
.pop small { color: var(--muted); font-size: 11px; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }

/* ---------- tool rail */
.tools { grid-area: tools; display: flex; flex-direction: column; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; overflow-y: auto; min-height: 0; }
.tools .grp { font: 600 9px/1 var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 8px 0 3px; letter-spacing: 0.08em; border: 0; background: none; border-radius: 5px; display: flex; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
.tools .grp:hover { color: var(--ink); background: var(--panel-2); }
.tools .grp svg { width: 8px; height: 8px; flex: none; transition: transform 0.15s; }
.tools .grp span { min-width: 0; }
.tools .grp[aria-expanded="false"] svg { transform: rotate(-90deg); }
.tools .tool.shut { display: none; }
.namegrid { display: grid; gap: 2px; }
.tool { display: grid; justify-items: center; gap: 3px; border: 0; background: none; border-radius: 6px; padding: 7px 2px 6px; color: var(--muted); font-size: 10.5px; line-height: 1.1; }
.tool svg { width: 22px; height: 22px; }
.tool:hover { background: var(--panel-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* ---------- stage */
.stage { grid-area: stage; position: relative; background: var(--stage); border-radius: var(--r); overflow: hidden; min-height: 0; border: 1px solid var(--line); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.chips { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; max-width: calc(100% - 20px); }
.chip { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; font: 500 11px/1.4 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.warn { color: var(--warn); }
.chip.live { color: var(--teal); }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom .btn { background: color-mix(in srgb, var(--panel) 94%, transparent); padding: 6px; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 999px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.2s; max-width: calc(100% - 100px); text-align: center; }
.toast.on { opacity: 1; }
.hint { position: absolute; left: 10px; bottom: 10px; max-width: min(380px, calc(100% - 70px)); font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; pointer-events: none; }

/* ---------- inspector */
.panel { grid-area: panel; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 10px 6px 9px; font-size: 12px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.insp { padding: 14px 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 14px; }
.sec h3 { margin: 0; font: 600 10px/1 var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.sec h2 { margin: 0; font: 500 19px/1.15 var(--f-map); text-wrap: balance; }
.sec p { margin: 0; color: var(--muted); font-size: 12px; }
.row { display: grid; gap: 5px; }
.row .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.row .val { font: 500 11px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.txt { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
textarea.txt { resize: vertical; min-height: 54px; font: 15px/1.3 var(--f-map); }
.txt.map { font: 15px var(--f-map); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pick { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 4px; display: grid; justify-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.pick canvas { width: 46px; height: 22px; }
.tips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.tips .pick { padding: 5px 2px; font-size: 10.5px; }
.tips .pick canvas { width: 32px; height: 22px; }
.pick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.check { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.confirm { border: 1px solid var(--warn); border-radius: 6px; padding: 9px; display: grid; gap: 8px; font-size: 12px; }
.keys { font: 500 10.5px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.legend-k { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 12px; color: var(--muted); align-items: center; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "bar" "stage" "tools" "panel"; }
  .stage { height: 64vh; min-height: 340px; }
  .tools { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 4px; }
  .tools .grp { display: none; }
  .tools .tool.shut { display: grid; }
  .tool { min-width: 58px; }
  .panel { min-height: 0; }
  .insp { overflow: visible; }
  .name-in { width: 120px; }
  .gen { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { .gen .fill, .toast { transition: none; } }
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand"><span class="brand-mark">Atlas Engine</span></div>
    <input class="name-in" id="mapName" aria-label="Map name" value="Larlesienne-Carillon">
    <div class="seg" role="group" aria-label="View">
      <button id="vAtlas" aria-pressed="true" title="Finished atlas render">Atlas</button>
      <button id="vOverlay" aria-pressed="false" title="Atlas with your painted layers on top">Overlay</button>
      <button id="vSketch" aria-pressed="false" title="Only your painted layers">Sketch</button>
    </div>
    <button class="btn toggle" id="pureBtn" aria-pressed="false" title="Hide all names, symbols, roads, borders and grid">Pure terrain</button>
    <div class="spacer"></div>
    <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4 2.5 7.5 6 11"/><path d="M3 7.5h6.5a3.5 3.5 0 0 1 0 7H8"/></svg></button>
    <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4l3.5 3.5L10 11"/><path d="M13 7.5H6.5a3.5 3.5 0 0 0 0 7H8"/></svg></button>
    <button class="btn gen" id="genBtn"><i class="fill" id="genFill"></i><span id="genLabel">Generate terrain</span></button>
    <div class="popwrap">
      <button class="btn" id="fileBtn" aria-haspopup="true" aria-expanded="false">File <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m4 6 4 4 4-4"/></svg></button>
      <div class="pop" id="filePop" hidden>
        <button id="expPng"><b>Export map image</b><small id="expPngSize">PNG</small></button>
        <button id="expJson"><b>Save project file</b><small>Everything you painted and placed (.json)</small></button>
        <button id="openJson"><b>Open project file…</b><small>Load a saved .json</small></button>
        <button id="insJson"><b>Insert a saved map…</b><small>Place another project into this one</small></button>
        <hr>
        <small id="dlNote" style="padding:2px 10px 6px">Your work also autosaves in this browser.</small>
      </div>
    </div>
  </header>

  <nav class="tools" id="tools" aria-label="Tools"></nav>

  <main class="stage" id="stage">
    <canvas id="view" aria-label="Map canvas"></canvas>
    <div class="chips"><span class="chip" id="cRef">—</span><span class="chip" id="cElev">—</span><span class="chip" id="cZoom">100%</span><span class="chip" id="cState" hidden></span></div>
    <div class="hint" id="hint" hidden></div>
    <div class="zoom">
      <button class="btn" id="zIn" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M3 8h10"/></svg></button>
      <button class="btn" id="zOut" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10"/></svg></button>
      <button class="btn" id="zFit" title="Fit map" aria-label="Fit map"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
    </div>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabTool" aria-selected="true">Tool</button>
      <button role="tab" id="tabWorld" aria-selected="false">World</button>
      <button role="tab" id="tabMap" aria-selected="false">Map settings</button>
    </div>
    <div class="insp" id="insp"></div>
  </aside>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="insIn" accept=".json,application/json" hidden>

<script id="engine-src" type="text/plain">
// ===================================================================== ENGINE
// Noise, filters, erosion worker, terrain preparation and atlas raster render.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(ix, iy, s) {
  let h = Math.imul(ix, 0x27d4eb2d) ^ Math.imul(iy, 0x165667b1) ^ Math.imul(s, 0x9e3779b9);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 2147483648 - 1;
}
function vn(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s), c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
// roughly unit-variance fractal noise, x/y in "lattice cells"
function fbm(x, y, s, oct, gain) {
  gain = gain || 0.5;
  let sum = 0, amp = 1, tot = 0, f = 1;
  for (let i = 0; i < oct; i++) { sum += amp * vn(x * f, y * f, s + i * 31); tot += amp; amp *= gain; f *= 2.03; }
  return (sum / tot) * 1.6;
}
// field over a w*h grid; freq = lattice cells per map width
function fbmField(w, h, freq, oct, seed) {
  const out = new Float32Array(w * h), sc = freq / w;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) out[y * w + x] = fbm(x * sc, y * sc, seed, oct);
  return out;
}

function boxesForGauss(sigma) {
  const n = 3, wI = Math.sqrt((12 * sigma * sigma) / n + 1);
  let wl = Math.floor(wI); if (wl % 2 === 0) wl--;
  const wu = wl + 2;
  const m = Math.round((12 * sigma * sigma - n * wl * wl - 4 * n * wl - 3 * n) / (-4 * wl - 4));
  const s = []; for (let i = 0; i < n; i++) s.push(i < m ? wl : wu); return s;
}
function boxH(src, dst, w, h, r) {
  const ia = 1 / (r + r + 1);
  for (let y = 0; y < h; y++) {
    const o = y * w; let acc = 0;
    for (let k = -r - 1; k < r; k++) acc += src[o + Math.min(w - 1, Math.max(0, k))];
    for (let x = 0; x < w; x++) {
      acc += src[o + Math.min(w - 1, x + r)] - src[o + Math.max(0, x - r - 1)];
      dst[o + x] = acc * ia;
    }
  }
}
function boxV(src, dst, w, h, r) {
  const ia = 1 / (r + r + 1);
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let k = -r - 1; k < r; k++) acc += src[Math.min(h - 1, Math.max(0, k)) * w + x];
    for (let y = 0; y < h; y++) {
      acc += src[Math.min(h - 1, y + r) * w + x] - src[Math.max(0, y - r - 1) * w + x];
      dst[y * w + x] = acc * ia;
    }
  }
}
function blur(src, w, h, sigma) {
  const a = Float32Array.from(src);
  if (sigma < 0.35) return a;
  const b = new Float32Array(a.length);
  for (const s of boxesForGauss(sigma)) { const r = (s - 1) >> 1; boxH(a, b, w, h, r); boxV(b, a, w, h, r); }
  return a;
}
function resize(src, sw, sh, dw, dh) {
  const out = new Float32Array(dw * dh), fx = sw / dw, fy = sh / dh;
  for (let y = 0; y < dh; y++) {
    let sy = (y + 0.5) * fy - 0.5; if (sy < 0) sy = 0; if (sy > sh - 1) sy = sh - 1;

  else { S.name = 'Untitled'; S.pendingPopulate = false; }
  $('mapName').value = S.name;
  T = null; hasRaster = false; rivers = { list: [], thr: 1 }; autoRoads = []; CG = null;
  sketchAll(); afterObjectsChange(); markTerrainStale();
  if (kind !== 'blank') generate(); else { setTool('land'); toast('Paint land with the Land brush, then generate terrain'); }
  autosave();
}

// ===================================================================== persistence
function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function rle(u) {
  const out = []; let i = 0;
  while (i < u.length) { const v = u[i]; let n = 1; while (i + n < u.length && u[i + n] === v && n < 255) n++; out.push(v, n); i += n; }
  return 'r:' + b64(Uint8Array.from(out));
}
function unrle(s, len) {
  if (!s.startsWith('r:')) return unb64(s);
  const d = unb64(s.slice(2)), u = new Uint8Array(len); let p = 0;
  for (let i = 0; i < d.length; i += 2) { u.fill(d[i], p, p + d[i + 1]); p += d[i + 1]; }
  return u;
}
function serialize() {
  const layers = {};
  for (const [k, v] of Object.entries(S.layers)) { const u = new Uint8Array(v.length); for (let i = 0; i < v.length; i++) u[i] = Math.round(clamp(v[i], 0, 1) * 255); layers[k] = rle(u); }
  return JSON.stringify({ app: 'atlas-editor', v: 2, ew: EW, eh: EH, erase: eraseAny ? rle(ERASE) : null, name: S.name, seed: S.seed, p: S.p, mw: MW, mh: MH, pw: PW, ph: PH, layers, places: S.places, labels: S.labels, roads: S.roads });
}
function parseProject(txt) {
  const o = JSON.parse(txt);
  if (!o || o.app !== 'atlas-editor' || !o.pw || !o.ph || !o.layers) throw new Error('That file is not a saved map from this editor.');
  o.mw = o.mw || 1000; o.mh = o.mh || Math.round(1000 * o.ph / o.pw);
  const L = E.emptyLayers(o.pw, o.ph);
  for (const k of Object.keys(L)) if (o.layers[k]) { const u = unrle(o.layers[k], L[k].length); for (let i = 0; i < u.length && i < L[k].length; i++) L[k][i] = u[i] / 255; }
  // older saves: no per-stroke drift yet, so everything keeps the drift it was made with
  if (!o.layers.drift) L.drift.fill(clamp(((o.p && o.p.coastDrift != null) ? o.p.coastDrift : 0.2) / 1.5, 0, 1));
  o.L = L;
  return o;
}
function deserialize(txt) {
  const o = parseProject(txt);
  setDims(o.mw, o.mh);
  const L = {};
  for (const k of Object.keys(o.L)) L[k] = (o.pw === PW && o.ph === PH) ? o.L[k] : E.resize(o.L[k], o.pw, o.ph, PW, PH);
  S.layers = L; S.name = o.name || (o.populate ? genName('realm') : 'Untitled'); S.seed = o.seed || 1;
  S.pendingPopulate = o.populate ? 'world' : false;
  const show = { ...S.p.show, ...((o.p && o.p.show) || {}) };
  if (o.p && o.p.coastDrift == null) o.p.coastDrift = 0.2;
  S.p = { ...S.p, ...o.p, show };
  S.places = o.places || []; S.labels = o.labels || []; S.roads = o.roads || [];
  // older saves used the previous sample name
  if (S.name === 'Essaran') S.name = APP_NAME;
  for (const Lb of S.labels) if (Lb.text === 'Essaran') { Lb.text = 'Larlesienne-\nCarillon'; Lb.size = Math.min(Lb.size || 1, 0.66); }
  if (o.erase && o.ew && o.eh) {
    const src = unrle(o.erase, o.ew * o.eh);
    for (let y = 0; y < EH; y++) for (let x = 0; x < EW; x++) ERASE[y * EW + x] = src[Math.min(o.eh - 1, (y * o.eh / EH) | 0) * o.ew + Math.min(o.ew - 1, (x * o.ew / EW) | 0)];
  }
  eraseAll();
  let mx = 0; for (const arr of [S.places, S.labels, S.roads]) for (const q of arr) { const n = parseInt(String(q.id).slice(1), 10); if (n > mx) mx = n; }
  uid = mx + 1;
}
function afterLoad() {
  $('mapName').value = S.name; ui.sel = null; ui.draft = null; ui.insert = null;
  T = null; hasRaster = false; rivers = { list: [], thr: 1 }; autoRoads = []; CG = null;
  sketchAll(); afterObjectsChange(); fitView(); updateZoomChip(); renderInspector(); markTerrainStale(); generate();
}
let saveTimer = 0;
function autosave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(LS_KEY, serialize()); } catch (e) { /* storage unavailable */ } }, 1200);
}
let downloads = null;
const STANDALONE = !(window.claude && window.claude.use);
(async () => {
  if (STANDALONE) { $('dlNote').textContent = 'Your work also autosaves in this browser.'; return; }
  try { downloads = await window.claude.use('downloads'); } catch (e) { downloads = null; }
  if (!downloads) { $('expPng').disabled = true; $('expJson').disabled = true; $('dlNote').textContent = 'Saving files isn\u2019t available in this view. Your work autosaves in this browser.'; }
})();
async function saveFile(filename, data) {
  if (STANDALONE) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Saved ' + filename); return;
  }
  if (!downloads) { toast('Saving files isn\u2019t available here'); return; }
  try { await downloads.save({ filename, data }); toast('Saved ' + filename); }
  catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? 'A save is already waiting for you' : 'Could not save the file'); }
}
const fileSlug = () => (S.name || 'map').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'map';
async function exportPng() {
  if (!T) { toast('Generate terrain first'); return; }
  toast(`Rendering ${XW.toLocaleString('en-US')} × ${XH.toLocaleString('en-US')} map…`);
  const w = makeWorker('raster');
  const img = await new Promise((res, rej) => { w.onmessage = (ev) => ev.data.type === 'raster' ? res(ev.data) : rej(new Error(ev.data.msg)); w.onerror = rej; w.postMessage({ st: rasterState(), T: terrainForRaster(), W: XW, H: XH, job: 0 }); }).catch(() => null);
  w.terminate();
  if (!img) { toast('Export failed'); return; }
  const c = document.createElement('canvas'); c.width = XW; c.height = XH;
  const x = c.getContext('2d');
  x.putImageData(new ImageData(img.img, XW, XH), 0, 0);
  const st = document.createElement('canvas'); st.width = XW; st.height = XH;
  drawStatic(st.getContext('2d'), XW / MW, XW, XH);
  x.drawImage(st, 0, 0);
  x.setTransform(XW / MW, 0, 0, XW / MW, 0, 0);
  if (layoutDirty) computeLayout();
  drawObjects(x);
  x.strokeStyle = '#2a2724'; x.lineWidth = 1; x.strokeRect(0.5, 0.5, MW - 1, MH - 1);
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  await saveFile(fileSlug() + '.png', blob);
}

// ===================================================================== chrome wiring
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }
$('vAtlas').onclick = () => setView('atlas'); $('vOverlay').onclick = () => setView('overlay'); $('vSketch').onclick = () => setView('sketch');
$('undoBtn').onclick = undo; $('redoBtn').onclick = redo;
$('pureBtn').onclick = () => setPure(!S.p.pure);

$('insIn').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { beginInsert(parseProject(await f.text())); toast('Drag the map into place, then press Insert here'); }
  catch (err) { toast(err.message || 'Could not read that file'); }
};
$('genBtn').onclick = () => generate();
$('zIn').onclick = () => { zoomAt(1.35, V.w / 2, V.h / 2); updateZoomChip(); };
$('zOut').onclick = () => { zoomAt(1 / 1.35, V.w / 2, V.h / 2); updateZoomChip(); };
$('zFit').onclick = () => { fitView(); updateZoomChip(); };
$('mapName').addEventListener('input', (e) => { S.name = e.target.value; autosave(); if (ui.tab === 'tool' && !getSel() && (ui.tool === 'select' || ui.tool === 'pan')) { const h2 = document.querySelector('#insp h2'); if (h2) h2.textContent = S.name || 'Untitled'; } });
const filePop = $('filePop');
$('fileBtn').onclick = (e) => { e.stopPropagation(); filePop.hidden = !filePop.hidden; $('fileBtn').setAttribute('aria-expanded', String(!filePop.hidden)); };
document.addEventListener('click', (e) => { if (!filePop.hidden && !filePop.contains(e.target)) { filePop.hidden = true; $('fileBtn').setAttribute('aria-expanded', 'false'); } });
$('expPng').onclick = () => { filePop.hidden = true; exportPng(); };
$('expJson').onclick = () => { filePop.hidden = true; saveFile(fileSlug() + '.atlas.json', serialize()); };
$('openJson').onclick = () => { filePop.hidden = true; $('fileIn').click(); };
$('insJson').onclick = () => { filePop.hidden = true; $('insIn').click(); };
$('fileIn').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    deserialize(await f.text());
    hist.undo.length = 0; hist.redo.length = 0; updateUndoUI();
    afterLoad(); toast('Opened ' + f.name);
  } catch (err) { toast(err.message || 'Could not open that file'); }
};
let lastW = 0;
new ResizeObserver(() => { resizeView(); if (Math.abs(V.w - lastW) > 40) { fitView(); lastW = V.w; } updateZoomChip(); updateHint(); }).observe($('stage'));

// ===================================================================== boot
buildTools();
setDims(1000, 1000);
let restored = false;
try { const saved = localStorage.getItem(LS_KEY); if (saved) { deserialize(saved); restored = true; } } catch (e) { restored = false; }
if (!restored) { setDims(1000, 1000); S.layers = E.sampleLayers(PW, PH, 7); S.pendingPopulate = true; }
$('mapName').value = S.name;
sketchAll(); updateUndoUI(); setTool('select'); setView('atlas'); $('pureBtn').setAttribute('aria-pressed', String(!!S.p.pure));
fontsReady.then(() => { MEAS.clear(); relayout(); renderInspector(); });
generate();
requestAnimationFrame(loop);

</script>
